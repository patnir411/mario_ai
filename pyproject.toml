[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mario_ai"
version = "0.1.0"
description = "Emulator-backed search and learned control for Mario games across NES, GB, and GBA"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=2.0",
    "torch>=2.4",
    "pillow>=10",
    "imageio>=2.30",
    "jsonschema>=4.20",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
nes = [
    "gym-super-mario-bros==8.0.0",
    "nes-py==9.0.0",
]
sml = ["pyboy>=2.7.0,<2.8"]
gba = ["stable-retro==1.0.1"]

[tool.uv]
# These emulator stacks impose disjoint pyglet ranges:
# nes-py 9.0.0 requires pyglet<=1.5.21, while stable-retro 1.0.1 requires
# pyglet>=1.5.27,<2. Keep them in separate environments.
conflicts = [
    [
        { extra = "nes" },
        { extra = "gba" },
    ],
]

[tool.setuptools]
packages = ["mario"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "mps: tests that touch the torch MPS backend (tolerance-based, never bit-exact)",
    "slow: opt-in integration tests that may run long or require external ROMs",
]

# Native arm64 interpreter required (M2 Pro). Created with:
#   uv venv --python 3.13 venv   (uv-provided cpython-3.13-macos-aarch64)
# The /usr/local python3.13 is x86_64/Rosetta and disables torch MPS — do NOT use it.
